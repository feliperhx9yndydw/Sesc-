<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sesc São Paulo — Protótipo</title>
  <style>*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f7f7;color:#111}
body{overflow:hidden}
.app{width:100%;height:100%;max-width:520px;margin:auto;background:#fff;position:relative;overflow:hidden}
.topbar{height:82px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #eee;background:#fff;position:relative;z-index:3}
.menu-btn{border:0;background:none;width:42px;height:42px;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer}
.menu-btn span{height:2px;width:25px;background:#111;border-radius:2px}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-size:38px;font-weight:900;letter-spacing:-3px;font-style:italic}
.screen{height:calc(100% - 82px);overflow:auto;background:#fff}
.home{padding:26px 22px}
.home h1{font-size:28px;margin:10px 0 8px}
.home p{color:#666;line-height:1.45}
.card{border:1px solid #ddd;border-radius:18px;padding:20px;margin-top:24px}
.card button{width:100%;padding:16px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700}
.credential{min-height:100%;background:#fff;position:relative;display:flex;justify-content:center;padding:22px 12px 40px}
.credential-card{width:min(100%,390px);background:#fff;position:relative;text-align:center;padding:10px 12px 30px}
.cred-logo{font-size:43px;font-weight:900;font-style:italic;letter-spacing:-4px;margin:2px 0 16px}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 24px}
.name{font-size:28px;line-height:1.12;font-weight:800;margin:0 auto 12px}
.birth{font-size:20px;margin-bottom:26px}
.type{font-size:18px;line-height:1.35;margin-bottom:58px}
.number{font-size:17px;font-weight:800;letter-spacing:.5px;margin-bottom:22px}
.barcode{height:92px;margin:0 auto 30px;width:78%;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
.barcode i{display:block;background:#111;height:100%}
.valid{font-size:17px;margin-top:10px}
.demo-badge{position:absolute;top:145px;left:50%;transform:translateX(-50%) rotate(-10deg);border:3px solid #b00020;color:#b00020;background:rgba(255,255,255,.92);font-size:18px;font-weight:900;padding:7px 13px;letter-spacing:1px;z-index:2}
.notice{margin:20px auto 0;max-width:360px;font-size:11px;color:#777;line-height:1.35}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:4;display:none}
.overlay.show{display:block}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(82%,390px);background:#fff;z-index:5;transform:translateX(-105%);transition:transform .22s ease;overflow:auto;padding:28px 16px 28px}
.drawer.open{transform:translateX(0)}
.drawer-title{font-size:19px;margin:2px 8px 2px}
.updated{font-size:12px;color:#999;margin:0 8px 20px}
.nav-item{width:100%;border:0;background:#fff;text-align:left;display:flex;align-items:center;gap:16px;padding:12px 8px;font-size:16px;color:#222;border-radius:8px;cursor:pointer}
.nav-item span{width:25px;text-align:center;color:#222;font-size:20px}
.nav-item:hover,.nav-item.active{background:#f4f4f4}
.divider{height:1px;background:#ddd;margin:9px 0}
@media(max-width:390px){
 .topbar{height:70px}.screen{height:calc(100% - 70px)}
 .logo{font-size:34px}.name{font-size:24px}.avatar{width:135px;height:135px}
 .type{margin-bottom:42px}
}
</style>
</head>

function homePage(){
  screen.innerHTML = `
    <section class="home">
      <h1>Página inicial</h1>
      <p>Protótipo de navegação inspirado na estrutura apresentada.</p>
      <div class="card">
        <h2>Credencial Sesc SP</h2>
        <p>Acesse a tela de demonstração da credencial.</p>
        <button id="goCredential">Abrir Credencial Sesc SP</button>
      </div>
    </section>`;
  document.getElementById("goCredential").onclick = () => {
    credentialPage();
    closeMenu();
  };
}

function closeMenu(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}
function openMenu(){
  drawer.classList.add("open");
  overlay.classList.add("show");
}

menuBtn.onclick = () => drawer.classList.contains("open") ? closeMenu() : openMenu();
overlay.onclick = closeMenu;

document.querySelectorAll(".nav-item").forEach(item=>{
  item.addEventListener("click", ()=>{
    if(item.dataset.page === "credential"){
      credentialPage();
      closeMenu();
    } else if(item.dataset.page === "home"){
      homePage();
      closeMenu();
    }
  });
});

credentialPage();
</script>
